# Build the SegQueue extension on every push to main, and publish it as a
# release the moment its version changes.
#
# The module checks this repository's releases when an annotator opens it and
# offers a one-press update, so "publishing" is not an administrative step at
# the end of a project -- it is how a fix reaches thirty laptops. Two properties
# matter more than anything else here:
#
# * **A push that does not bump the version publishes nothing.** The tag is
#   derived from __version__, and an existing tag means the work is already
#   released. Otherwise every README typo would prompt every annotator to
#   restart Slicer.
# * **A broken build never becomes a release.** The shared package's tests and a
#   structural check of the archive both run first. An annotator pressing
#   "Update and restart" is trusting this file.
# * **Versions only go up.** A version not newer than every published
#   `segqueue-v` tag fails the run instead of publishing out of sequence.
#
# From 0.14.0 the module released here is **SegQueue14** (project lead,
# 2026-10-17), built by slicer/build-extension14.py into the same
# `SegQueue-<v>-Slicer-<x.y>.zip` under the same `segqueue-v<v>` tags, so
# SegQueue 0.13's update button installs it over the 4-class module.
# slicer/SegQueue (the 4-class module, 0.13.0) is no longer released.

name: SegQueue release

on:
  push:
    branches: [main]
    paths:
      - "slicer/**"
      - "src/segqueue/**"
      - "src/segqueue14/**"
      - "tests/test_segqueue_*.py"
      - "tests/test_segqueue14_*.py"
      - ".github/workflows/segqueue-release.yml"
  # A pull request builds and tests and keeps the archive on the run; only main
  # publishes.
  pull_request:
    paths:
      - "slicer/**"
      - "src/segqueue/**"
      - "src/segqueue14/**"
      - "tests/test_segqueue_*.py"
      - "tests/test_segqueue14_*.py"
      - ".github/workflows/segqueue-release.yml"
  workflow_dispatch:

# Creating the tag and the release needs write access to the repository.
permissions:
  contents: write

# Two pushes in quick succession must not race to create the same tag.
concurrency:
  group: segqueue-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # build-extension.py stamps the commit into the .s4ext, and the tag
          # check reads the remote's tags.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          # The project's own light dependencies plus pytest; conftest.py imports
          # segtrain, so the package has to be importable even for these tests.
          pip install -e ".[dev]" requests

      - name: Test the shared package
        # Only the client-side segqueue tests. The server tests want a MongoDB
        # and the training tests want a 300 GB dataset; neither says anything
        # about whether this archive is safe to hand an annotator.
        #
        # test_segqueue_portability.py earns its place here above all: it
        # is the check that the shared package still imports on Python 3.9
        # with nothing installed, which is the one thing that cannot be
        # fixed after the archive is on somebody's laptop.
        run: |
          python -m pytest -q \
            tests/test_segqueue_module.py \
            tests/test_segqueue_portability.py \
            tests/test_segqueue_release.py \
            tests/test_segqueue_updater.py \
            tests/test_segqueue_notes.py \
            tests/test_segqueue_protocol.py \
            tests/test_segqueue_states.py \
            tests/test_segqueue_policy.py \
            tests/test_segqueue_checksum.py \
            tests/test_segqueue_dataset.py \
            tests/test_segqueue_client.py \
            tests/test_segqueue14_shared.py \
            tests/test_segqueue14_client.py \
            tests/test_segqueue14_convert.py \
            tests/test_segqueue14_module.py \
            tests/test_segqueue14_release_line.py \
            tests/test_segqueue14_macos.py

      - name: Read the module version
        id: version
        run: |
          VERSION=$(python slicer/build-extension14.py --print-version)
          test -n "$VERSION" || { echo "could not read __version__"; exit 1; }
          echo "version=$VERSION"          >> "$GITHUB_OUTPUT"
          echo "tag=segqueue-v$VERSION"    >> "$GITHUB_OUTPUT"
          echo "SegQueue \`$VERSION\`"     >> "$GITHUB_STEP_SUMMARY"

      - name: Is it the next version?
        # Sequential numbering: never below a published SegQueue release.
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git ls-remote --tags origin 'refs/tags/segqueue-v*' | sed 's|.*refs/tags/||; s|\^{}$||' | sort -u > tags.txt
          python - <<'PY'
          import os, sys
          sys.path.insert(0, "src")
          from segqueue.release import is_newer, parse_version
          version = os.environ["VERSION"]
          tags = [t.strip() for t in open("tags.txt") if t.strip()]
          if "segqueue-v" + version in tags:
              print("segqueue-v%s is already published" % version)
              raise SystemExit(0)
          newest = max((t for t in tags if parse_version(t)), key=lambda t: parse_version(t)[0], default=None)
          if newest and not is_newer(version, newest):
              raise SystemExit("version %s is not newer than %s; bump __version__ in "
                               "slicer/SegQueue14/SegQueue14.py" % (version, newest))
          print("%s follows %s" % (version, newest))
          PY

      - name: Build the extension archive
        run: python slicer/build-extension14.py --out dist

      - name: Check the archive is installable
        # The same shape check the updater runs on an annotator's machine before
        # it overwrites anything, run here where a failure costs nobody an
        # afternoon.
        run: |
          python - <<'PY'
          import glob, sys, zipfile
          sys.path.insert(0, "src")
          from segqueue.release import ASSET_PATTERN, archive_members

          # The cross-platform archive (every update button reads it) and the
          # macOS one (Install from file on a Mac, #94), and nothing else.
          archives = glob.glob("dist/*.zip")
          generic = [a for a in archives if not a.endswith("-macOS.zip")]
          macos = [a for a in archives if a.endswith("-macOS.zip")]
          if len(generic) != 1 or len(macos) != 1:
              raise SystemExit("expected one archive and one macOS archive, found %r" % archives)
          path = generic[0]

          name = path.split("/")[-1]
          match = ASSET_PATTERN.match(name)
          if match is None:
              raise SystemExit("%s is not named the way the updater expects" % name)
          slicer_version = match.group("slicer")

          with zipfile.ZipFile(path) as archive:
              names = archive.namelist()
              broken = archive.testzip()
          if broken is not None:
              raise SystemExit("archive is corrupt at %s" % broken)

          members = archive_members(names, slicer_version)
          required = [
              "SegQueue14.py",
              "SegQueue.py",               # the stub that retires the 4-class module
              "SegQueue14Lib/updater.py",
              "segqueue/release.py",
              "segqueue14/protocol.py",
              "Resources/Icons/SegQueue14.png",
              "Resources/Icons/wordmark-light.png",
              "Resources/Icons/wordmark-dark.png",
          ]
          missing = [r for r in required
                     if not any(m.endswith("/" + r) for m in members)]
          if missing:
              raise SystemExit("archive is missing %s" % ", ".join(missing))
          if "SegQueue/share/Slicer-%s/SegQueue.s4ext" % slicer_version not in names:
              raise SystemExit("archive has no .s4ext; the Extension Manager will refuse it")
          print("%s: %d module files, descriptor present" % (name, len(members)))

          # What both update buttons will run on an annotator's laptop: SegQueue
          # 0.13's (it must accept this archive) and SegQueue14's own.
          for lib in ("slicer/SegQueue", "slicer/SegQueue14"):
              sys.path.insert(0, lib)
          from SegQueueLib import updater as old
          from SegQueue14Lib import updater as new
          old.inspectArchive(path, slicer_version)
          new.inspectArchive(path, slicer_version)
          print("accepted by the SegQueue 0.13 and SegQueue14 updaters")

          # The macOS archive: for every known revision of this Slicer, the
          # subtree a Mac's Slicer copies out holds exactly the generic tree.
          import importlib.util
          spec = importlib.util.spec_from_file_location("b14", "slicer/build-extension14.py")
          b14 = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(b14)
          mac = macos[0]
          if mac.split("/")[-1] != name[:-len(".zip")] + "-macOS.zip":
              raise SystemExit("%s does not match %s" % (mac, name))
          with zipfile.ZipFile(mac) as archive:
              macnames = set(archive.namelist())
          for revision in b14.MACOS_REVISIONS[slicer_version]:
              prefix = b14.macosBundlePrefix(revision)
              tree = {n[len(prefix):] for n in macnames if n.startswith(prefix)}
              expected = {n[len("SegQueue/"):] for n in names if not n.endswith("/")}
              if tree != expected:
                  raise SystemExit("macOS archive differs from %s under %s" % (name, prefix))
          print("%s: installable on macOS Slicer revisions %s"
                % (mac.split("/")[-1], ", ".join(b14.MACOS_REVISIONS[slicer_version])))
          PY

      - name: Keep the archive on the run
        # Uploaded whether or not a release is cut, so a push that only changes
        # code still leaves something installable to test by hand.
        uses: actions/upload-artifact@v4
        with:
          name: SegQueue-${{ steps.version.outputs.version }}
          path: dist/*.zip
          if-no-files-found: error

      - name: Has this version already been released?
        id: tag
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag \`${{ steps.version.outputs.tag }}\` already exists - built, not released. Bump \`__version__\` to publish." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish the release
        if: steps.tag.outputs.exists == 'false' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cat > notes.md <<'MD'
          ## Install

          Annotate in **four classes** (LM, LAD, LCx, RCA): every side branch
          takes the class of the vessel it comes off, and a ramus intermedius is
          LCx. The module is under **Segmentation -> SegQueue**.

          **Already running SegQueue?** Open the module in Slicer. It checks for
          updates on its own and offers **Update and restart** - one press, no
          download to find, no Extensions Manager.

          **Installed the separate SegQueue14 0.1.0 extension?** Uninstall it in
          the Extensions Manager first; this release contains it.

          **First install:** download the `.zip` below (on a **Mac**, the one
          ending in `-macOS.zip`), then in Slicer go to
          **Extensions Manager -> Install from file**, pick it, and restart.
          Install **SegmentEditorExtraEffects** first if you have not already -
          it provides *Draw tube*, and "Install from file" does not resolve
          dependencies.

          ---
          MD
          gh release create "$TAG" dist/*.zip \
            --title "SegQueue $VERSION" \
            --notes-file notes.md \
            --generate-notes \
            --target "$GITHUB_SHA"
          echo "Released [\`$TAG\`](https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG)." >> "$GITHUB_STEP_SUMMARY"
