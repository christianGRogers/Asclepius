# Run one step of the SegQueue14 deploy (deploy/segqueue14-deploy.sh) on janus.
#
# Run by hand from the Actions tab (workflow_dispatch), choosing the step. It always
# deploys what is on `main` -- the released code (CONTRIBUTING.md §4) -- by updating the
# server's clone ~/Asclepius-sq14 to origin/main before running the step.
#
#   diagnose | status                      read-only
#   install                                backup, install the plugin, restart Girder
#   populate | populate --apply            dry run / create the pooled cases
#   worker | off                           start the SegQueue14 worker / rollback switch
#
# D36 (issue #124), in this order; see the script's header:
#   backup                                 mongodump of girder (pre-d36-<time>)
#   retire-live | restore-live             uninstall the old plugin / roll that back
#   retire-groups [--apply]                delete the old segqueue-* groups
#   consolidate [--apply]                  SegQueue14 writes into SegQueue
#
# D42 (issue #283), the hourly backup of janus to the lead's backup server; see
# deploy/backup/workflow-backup.sh:
#   backup-install                         key, password, route, timers, first backup
#   backup-status | backup-restore-test    read-only on live data
#   backup-off                             timers off; every snapshot is kept
#
# D43 (issue #286), the annotator benchmark; see server/girder_segqueue14/DEPLOY.md.
# Dry runs without --apply. `args` carries the logins, e.g. --exclude=<login>,<login>:
#   benchmark-status                       who has it, each attempt's Dice
#   benchmark-create [--apply]             draw once (never redrawn) and create the case, or
#                                          args: --imagecas-id=<N> [--replace] (the lead's choice)
#   benchmark-seed [--apply]               TotalSegmentator 2.18.0 on CPU, at nice 19, or
#                                          args: --from-girder=<folder> [--from-girder-file=<name>]
#   benchmark-assign [--apply]             args: --exclude=... [--login=...] [--retest]
#
# The script never touches the live checkout, the live plugin or live data; see its
# header. Secrets: SSH_HOST, SSH_PORT, SSH_USERNAME, SSH_PASSWORD (as server-ssh.yml),
# SSH_KNOWN_HOSTS optional. The backup steps also need SSH_PORT_SFTP_SERVER (the backup
# server: same host and login as janus, this port); optional: BACKUP_SFTP_LAN_ADDRESS
# (host:port of the backup server as seen from janus) and SSH_KNOWN_HOSTS_SFTP_SERVER.
# The backup repository has no password (the lead's decision on #283).

name: SegQueue14 on janus

on:
  workflow_dispatch:
    inputs:
      command:
        description: "deploy step"
        type: choice
        default: diagnose
        options: [diagnose, status, install, populate, "populate --apply", worker, off,
                  backup, retire-live, restore-live, retire-groups, "retire-groups --apply",
                  consolidate, "consolidate --apply",
                  backup-install, backup-status, backup-restore-test, backup-off,
                  benchmark-status, benchmark-create, "benchmark-create --apply",
                  benchmark-seed, "benchmark-seed --apply",
                  benchmark-assign, "benchmark-assign --apply"]
      args:
        description: "benchmark-assign: --exclude=<login,...> [--login=<login,...>] [--retest]; benchmark-seed: --from-girder=<folder> [--from-girder-file=<name>]; benchmark-create: --imagecas-id=<N> [--replace]"
        type: string
        required: false
        default: ""

concurrency:
  group: server-ssh
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    name: segqueue14 ${{ inputs.command }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Which step
        id: cmd
        env:
          INPUT: ${{ inputs.command }}
          ARGS: ${{ inputs.args }}
        run: |
          set -euo pipefail
          cmd="$INPUT"
          case "$cmd" in
            diagnose|status|install|populate|"populate --apply"|worker|off) ;;
            backup|retire-live|restore-live|retire-groups|"retire-groups --apply") ;;
            consolidate|"consolidate --apply") ;;
            backup-install|backup-status|backup-restore-test|backup-off) ;;
            benchmark-status|benchmark-create|"benchmark-create --apply") ;;
            benchmark-seed|"benchmark-seed --apply") ;;
            benchmark-assign|"benchmark-assign --apply") ;;
            *) echo "::error::unknown step '$cmd'"; exit 1 ;;
          esac
          # D43: only benchmark-assign, -seed and -create take arguments, and only these
          # options, as plain logins or Girder paths: the value reaches a shell on janus,
          # so nothing else passes (no quotes, spaces in values, globs or $).
          if [ -n "$ARGS" ]; then
            case "$cmd" in
              benchmark-assign*)
                if ! printf '%s' "$ARGS" | grep -Eq '^[A-Za-z0-9 ,._=-]+$'; then
                  echo "::error::args may hold only logins (letters, digits, . _ -), commas and the options"; exit 1
                fi
                for word in $ARGS; do
                  case "$word" in
                    --exclude=*|--login=*|--retest) ;;
                    *) echo "::error::args: '$word' is not --exclude=..., --login=... or --retest"; exit 1 ;;
                  esac
                done ;;
              benchmark-seed*)
                # #293: the Girder folder the lead uploaded the seed to, e.g. user/christian/Public.
                if ! printf '%s' "$ARGS" | grep -Eq '^[A-Za-z0-9 /._=-]+$'; then
                  echo "::error::args may hold only Girder paths (letters, digits, / . _ -) and the options"; exit 1
                fi
                for word in $ARGS; do
                  case "$word" in
                    --from-girder=?*|--from-girder-file=?*) ;;
                    *) echo "::error::args: '$word' is not --from-girder=<folder> or --from-girder-file=<name>"; exit 1 ;;
                  esac
                  case "$word" in *..*) echo "::error::args: '$word' may not hold '..'"; exit 1 ;; esac
                done
                case " $ARGS" in *" --from-girder="*) ;; *) echo "::error::benchmark-seed args need --from-girder=<folder>"; exit 1 ;; esac ;;
              benchmark-create*)
                # #293: the lead's choice of case, and swapping an untouched case for it.
                if ! printf '%s' "$ARGS" | grep -Eq '^[a-z0-9 =-]+$'; then
                  echo "::error::args may hold only --imagecas-id=<digits> and --replace"; exit 1
                fi
                for word in $ARGS; do
                  case "$word" in
                    --replace) ;;
                    --imagecas-id=*)
                      if ! printf '%s' "${word#--imagecas-id=}" | grep -Eq '^[0-9]{1,4}$'; then
                        echo "::error::args: --imagecas-id takes 1 to 4 digits"; exit 1
                      fi ;;
                    *) echo "::error::args: '$word' is not --imagecas-id=<digits> or --replace"; exit 1 ;;
                  esac
                done
                case " $ARGS" in *" --imagecas-id="*) ;; *) echo "::error::benchmark-create args need --imagecas-id=<digits>"; exit 1 ;; esac ;;
              *) echo "::error::only benchmark-assign, benchmark-seed and benchmark-create take args"; exit 1 ;;
            esac
            # The step is ours (a fixed list above), the options go first: --apply stays last.
            # shellcheck disable=SC2086  # split the fixed step into its words
            set -- $cmd
            cmd="$1 $ARGS${2:+ $2}"
          elif [[ "$cmd" == benchmark-assign* ]]; then
            echo "::error::benchmark-assign needs args: --exclude=<login,...> (the logins that never get it)"; exit 1
          fi
          echo "cmd=$cmd" >> "$GITHUB_OUTPUT"
          case "$cmd" in backup-*) echo "backup=true" >> "$GITHUB_OUTPUT" ;; esac
          echo "### segqueue14-deploy.sh \`$cmd\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Check the secrets are set
        env:
          HOST: ${{ secrets.SSH_HOST }}
          USERNAME: ${{ secrets.SSH_USERNAME }}
          PASSWORD: ${{ secrets.SSH_PASSWORD }}
          SFTP_PORT: ${{ secrets.SSH_PORT_SFTP_SERVER }}
          CMD: ${{ steps.cmd.outputs.cmd }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "$HOST" ]     || missing+=(SSH_HOST)
          [ -n "$USERNAME" ] || missing+=(SSH_USERNAME)
          [ -n "$PASSWORD" ] || missing+=(SSH_PASSWORD)
          # The backup steps (D42) also need the backup server's port.
          case "$CMD" in backup-*) [ -n "$SFTP_PORT" ] || missing+=(SSH_PORT_SFTP_SERVER) ;; esac
          if [ ${#missing[@]} -gt 0 ]; then echo "::error::not set: ${missing[*]}"; exit 1; fi

      - name: Install sshpass
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends sshpass

      - name: Trust the host key
        env:
          HOST: ${{ secrets.SSH_HOST }}
          PORT: ${{ secrets.SSH_PORT }}
          KNOWN: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          if [ -n "$KNOWN" ]; then
            printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "${PORT:-22}" -H "$HOST" > ~/.ssh/known_hosts 2>/dev/null
            echo ":warning: no SSH_KNOWN_HOSTS secret; accepted the host key offered." >> "$GITHUB_STEP_SUMMARY"
          fi
          chmod 600 ~/.ssh/known_hosts && test -s ~/.ssh/known_hosts

      # As in server-ssh.yml: the password goes through the environment (sshpass -e)
      # and, for sudo, through stdin -- never on a command line. The remote script
      # arrives base64-encoded in argv; it holds nothing secret.
      - name: Run the step on janus
        if: steps.cmd.outputs.backup != 'true'
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
          HOST: ${{ secrets.SSH_HOST }}
          PORT: ${{ secrets.SSH_PORT }}
          USERNAME: ${{ secrets.SSH_USERNAME }}
          CMD: ${{ steps.cmd.outputs.cmd }}
        run: |
          set -euo pipefail
          cat > remote.sh <<EOF
          set -uo pipefail
          SQ14_USER='${USERNAME}'
          home=\$(getent passwd "\$SQ14_USER" | cut -d: -f6)
          src="\$home/Asclepius-sq14"
          # Bring the server's clone of this branch up to date (as the deploy user,
          # with their GitHub credentials); fall back to the copy already there.
          if [ -d "\$src/.git" ]; then
            runuser -u "\$SQ14_USER" -- env HOME="\$home" git -C "\$src" fetch -q origin main \
              && runuser -u "\$SQ14_USER" -- env HOME="\$home" git -C "\$src" checkout -q -B main origin/main \
              || echo "[sq14] could not update \$src; using what is there"
          fi
          script="\$src/deploy/segqueue14-deploy.sh"
          [ -f "\$script" ] || { echo "[sq14] no \$script on the server"; exit 1; }
          echo "[sq14] running \$(runuser -u "\$SQ14_USER" -- env HOME="\$home" git -C "\$src" log -1 --format='%h %s' | cut -c1-60): ${CMD}"
          cd "\$home" && SQ14_USER="\$SQ14_USER" bash "\$script" ${CMD}
          EOF
          b64=$(base64 -w0 < remote.sh)
          set +e
          printf '%s\n' "$SSHPASS" | sshpass -e ssh -o BatchMode=no -o ConnectTimeout=20 \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o StrictHostKeyChecking=yes \
            -p "${PORT:-22}" "${USERNAME}@${HOST}" \
            "sudo -S -p '' bash -c 'echo $b64 | base64 -d | bash'" 2>&1 | tee out.txt
          code=${PIPESTATUS[1]}
          set -e
          { echo '```'; tail -n 200 out.txt; echo '```'; echo "exit $code"; } >> "$GITHUB_STEP_SUMMARY"
          exit "$code"

      # D42: the backup steps. Same janus connection as above; backup-install also
      # reaches the backup server (same host and login, port SSH_PORT_SFTP_SERVER).
      - name: Run the backup step
        if: steps.cmd.outputs.backup == 'true'
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
          HOST: ${{ secrets.SSH_HOST }}
          PORT: ${{ secrets.SSH_PORT }}
          USERNAME: ${{ secrets.SSH_USERNAME }}
          SFTP_PORT: ${{ secrets.SSH_PORT_SFTP_SERVER }}
          SFTP_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS_SFTP_SERVER }}
          LAN_ADDRESS: ${{ secrets.BACKUP_SFTP_LAN_ADDRESS }}
          CMD: ${{ steps.cmd.outputs.cmd }}
        run: |
          set -uo pipefail
          bash deploy/backup/workflow-backup.sh "$CMD" 2>&1 | tee out.txt
          code=${PIPESTATUS[0]}
          { echo '```'; tail -n 200 out.txt; echo '```'; echo "exit $code"; } >> "$GITHUB_STEP_SUMMARY"
          exit "$code"
