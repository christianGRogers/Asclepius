# Build the SegQueue14 extension on every pull request that touches it and every push
# to main, and publish it as a release when its version changes.
#
# The same contract as segqueue-release.yml, for the second module:
#
# * **A push that does not bump the version publishes nothing.** The tag is
#   `segqueue14-v<__version__>` (slicer/SegQueue14/SegQueue14.py); an existing tag
#   means that version is already out.
# * **A broken build never becomes a release.** The SegQueue14 client tests and a
#   structural check of the archive run first.
# * **It cannot be offered to SegQueue annotators.** The live module's updater
#   only considers tags starting `segqueue-v` and archives named `SegQueue-...`
#   (src/segqueue/release.py); these are `segqueue14-v...` and `SegQueue14-...`.
#   Releases are also published with `--latest=false`, so the repository's
#   "latest" stays the live module.
#
# SegQueue14 has no self-updater: an out-of-date module is told to update by the
# server at login (protocol check), and the annotator installs the new zip.

name: SegQueue14 release

on:
  push:
    branches: [main]
    paths:
      - "slicer/SegQueue14/**"
      - "slicer/build-extension14.py"
      - "src/segqueue14/**"
      - "src/segqueue/**"
      - "tests/test_segqueue14_*.py"
      - ".github/workflows/segqueue14-release.yml"
  pull_request:
    paths:
      - "slicer/SegQueue14/**"
      - "slicer/build-extension14.py"
      - "src/segqueue14/**"
      - "src/segqueue/**"
      - "tests/test_segqueue14_*.py"
      - ".github/workflows/segqueue14-release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: segqueue14-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" requests

      - name: Test the SegQueue14 client side
        # The client, shared-protocol, conversion and module-structure suites --
        # what decides whether this archive works on an annotator's laptop. The
        # server suite needs MongoDB and runs in ci.yml.
        run: |
          python -m pytest -q \
            tests/test_segqueue14_shared.py \
            tests/test_segqueue14_client.py \
            tests/test_segqueue14_convert.py \
            tests/test_segqueue14_module.py

      - name: Read the module version
        id: version
        run: |
          VERSION=$(python slicer/build-extension14.py --print-version)
          test -n "$VERSION" || { echo "could not read __version__"; exit 1; }
          echo "version=$VERSION"           >> "$GITHUB_OUTPUT"
          echo "tag=segqueue14-v$VERSION"   >> "$GITHUB_OUTPUT"
          echo "SegQueue14 \`$VERSION\`"    >> "$GITHUB_STEP_SUMMARY"

      - name: Build the extension archive
        run: python slicer/build-extension14.py --out dist

      - name: Check the archive is installable
        run: |
          python - <<'PY'
          import glob, re, zipfile

          archives = glob.glob("dist/*.zip")
          if len(archives) != 1:
              raise SystemExit("expected exactly one archive, found %r" % archives)
          path = archives[0]
          name = path.split("/")[-1]
          match = re.match(r"^SegQueue14-(?P<version>[0-9][0-9A-Za-z.\-+]*)-Slicer-(?P<slicer>[0-9]+\.[0-9]+)\.zip$", name)
          if match is None:
              raise SystemExit("%s is not named SegQueue14-<version>-Slicer-<x.y>.zip" % name)
          if name.startswith("SegQueue-"):
              raise SystemExit("would be mistaken for a live SegQueue release")
          slicer = match.group("slicer")
          with zipfile.ZipFile(path) as archive:
              names = archive.namelist()
              broken = archive.testzip()
          if broken is not None:
              raise SystemExit("archive is corrupt at %s" % broken)
          base = "SegQueue14/lib/Slicer-%s/qt-scripted-modules/" % slicer
          required = ["SegQueue14.py", "SegQueue14Lib/client.py", "segqueue14/protocol.py",
                      "segqueue14/labels.py", "segqueue/protocol.py",
                      "Resources/Icons/SegQueue14.png"]
          missing = [r for r in required if base + r not in names]
          if missing:
              raise SystemExit("archive is missing %s" % ", ".join(missing))
          if "SegQueue14/share/Slicer-%s/SegQueue14.s4ext" % slicer not in names:
              raise SystemExit("archive has no .s4ext; the Extension Manager will refuse it")
          print("%s: %d entries, descriptor present" % (name, len(names)))
          PY

      - name: Keep the archive on the run
        uses: actions/upload-artifact@v4
        with:
          name: SegQueue14-${{ steps.version.outputs.version }}
          path: dist/*.zip
          if-no-files-found: error

      - name: Has this version already been released?
        id: tag
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag \`${{ steps.version.outputs.tag }}\` already exists - built, not released. Bump \`__version__\` in slicer/SegQueue14/SegQueue14.py to publish." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish the release
        # Only from main: a pull request builds and tests, and leaves the archive on
        # the run for a hand test.
        if: steps.tag.outputs.exists == 'false' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cat > notes.md <<'MD'
          ## Install

          SegQueue14 is the 14-class annotation module. It installs **beside** SegQueue
          and does not replace it.

          Download the `.zip` below, then in Slicer: **Extensions Manager -> Install from
          file**, pick it, restart. The module is under **Segmentation -> SegQueue14**.
          Install **SegmentEditorExtraEffects** first if you have not already.

          **Updating:** SegQueue14 does not update itself. When the server needs a newer
          module it says so at login; install the newest zip from this page the same way.

          ---
          MD
          gh release create "$TAG" dist/*.zip \
            --title "SegQueue14 $VERSION" \
            --notes-file notes.md \
            --latest=false \
            --target "$GITHUB_SHA"
          echo "Released [\`$TAG\`](https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG)." >> "$GITHUB_STEP_SUMMARY"
