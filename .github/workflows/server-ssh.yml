# Test and deploy the server plugin on the real box, over SSH.
#
# Everything CI can answer without a server, CI already answers: `ci.yml` runs
# the Girder models against a real MongoDB and the real client against a real
# Girder over HTTP, both in throwaway containers. This workflow is for the two
# questions those cannot reach -- does the plugin load *on that machine*, and is
# the running deployment the code we think it is.
#
# **Manual only, and one mode at a time.** A deploy rebuilds containers that
# thirty annotators are talking to, so it does not hang off a push. Pick the mode
# deliberately:
#
#   smoke    read-only. Ask the running server what it is and which routes it
#            has. Safe at any time.
#   test     run the server test suite inside the girder container. Creates a
#            scratch database named segqueue_test_<random> and drops it again;
#            it never touches `girder`.
#   deploy   check the ref out on the box, rebuild, wait for health, then smoke.
#            Rolls back to the previous commit if the new one will not serve.
#
# Secrets: SSH_HOST, SSH_PORT, SSH_USERNAME, SSH_PASSWORD.
#
# SSH_KNOWN_HOSTS is optional and worth adding. Without it this workflow accepts
# whatever host key the server presents on first contact, which authenticates the
# password to the server but does nothing to prove the server is the right one --
# and the password is a secret being handed over on the strength of that. Get the
# value with `ssh-keyscan -p <port> <host>` from somewhere you trust.

name: Server over SSH

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "What to do on the server"
        type: choice
        required: true
        default: smoke
        options: [smoke, test, deploy]
      ref:
        description: "Branch or SHA to deploy (deploy mode only)"
        type: string
        required: false
        default: ""
      path:
        description: "Override the checkout path (blank = find it)"
        type: string
        required: false
        default: ""

# Two deploys at once would race on `docker compose up`, and a smoke test during
# a rebuild reports on whichever container happened to answer.
concurrency:
  group: server-ssh
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ssh:
    name: ${{ inputs.mode }} on the server
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Check the secrets are set
        # A missing secret otherwise shows up as ssh failing to resolve an empty
        # hostname, which reads like a network problem for about ten minutes.
        env:
          HOST: ${{ secrets.SSH_HOST }}
          USERNAME: ${{ secrets.SSH_USERNAME }}
          PASSWORD: ${{ secrets.SSH_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "$HOST" ]     || missing+=(SSH_HOST)
          [ -n "$USERNAME" ] || missing+=(SSH_USERNAME)
          [ -n "$PASSWORD" ] || missing+=(SSH_PASSWORD)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "Not set: ${missing[*]}" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "All four SSH secrets are present." >> "$GITHUB_STEP_SUMMARY"

      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends sshpass

      - name: Trust the host key
        env:
          HOST: ${{ secrets.SSH_HOST }}
          PORT: ${{ secrets.SSH_PORT }}
          KNOWN: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          if [ -n "$KNOWN" ]; then
            printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
            echo "Host key pinned from SSH_KNOWN_HOSTS." >> "$GITHUB_STEP_SUMMARY"
          else
            ssh-keyscan -p "${PORT:-22}" -H "$HOST" > ~/.ssh/known_hosts 2>/dev/null
            {
              echo ":warning: **No \`SSH_KNOWN_HOSTS\` secret**, so this run"
              echo "accepted whatever host key the server offered. Add the secret"
              echo '(`ssh-keyscan -p <port> <host>`) to close that window.'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          chmod 600 ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts

      # One helper for every remote command, so the password is passed through
      # the environment (`sshpass -e`) and never appears in a command line that
      # `ps` on a shared runner could read.
      - name: Write the ssh helper
        env:
          HOST: ${{ secrets.SSH_HOST }}
          PORT: ${{ secrets.SSH_PORT }}
          USERNAME: ${{ secrets.SSH_USERNAME }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/remote" <<EOF
          #!/usr/bin/env bash
          set -euo pipefail
          exec sshpass -e ssh \
            -o BatchMode=no -o ConnectTimeout=20 \
            -o UserKnownHostsFile=\$HOME/.ssh/known_hosts \
            -o StrictHostKeyChecking=yes \
            -p "${PORT:-22}" "${USERNAME}@${HOST}" "\$@"
          EOF
          chmod +x "$RUNNER_TEMP/remote"

          # The same, as root. Everything this workflow does needs it: the deploy
          # account is not in the `docker` group, so every docker call is denied,
          # and the checkout is root-owned. The script arrives as base64 in argv
          # because stdin carries the sudo password -- it holds nothing secret,
          # while a password on a command line would be readable in `ps`.
          cat > "$RUNNER_TEMP/remote-root" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          b64=$(cat | base64 -w0)
          printf '%s\n' "$SSHPASS" \
            | "$(dirname "$0")/remote" "sudo -S -p '' bash -c 'echo $b64 | base64 -d | bash'"
          EOF
          chmod +x "$RUNNER_TEMP/remote-root"
      # Where the deployment is, asked of the running process.
      #
      # This box does not run Docker. It runs the stack natively -- mongod,
      # girder and the score worker, started by `segqueue-data/segqueue.sh` --
      # which is why every earlier version of this workflow failed: it hunted for
      # a compose file and a /srv checkout that have never existed here, and
      # reported "no deployment" while the service was serving.
      #
      # The girder process knows where its own code is, so ask it. That survives
      # the directory being renamed, and it cannot be fooled by a stray clone.
      - name: Locate the deployment
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
          HINT: ${{ inputs.path }}
        run: |
          set -euo pipefail
          cat > probe.sh <<'PROBE'
          repo="$HINT_REPO"
          if [ -z "$repo" ]; then
            # /proc/<pid>/cmdline holds the venv path the server was started from.
            exe=$(pgrep -af 'girder serve' | awk '{print $2}' | head -1)
            [ -n "$exe" ] && repo=$(dirname "$(dirname "$(dirname "$exe")")")
          fi
          echo "REPO ${repo:-}"
          [ -n "$repo" ] && [ -d "$repo/.git" ] && echo "GIT ok" || echo "GIT missing"
          echo "LAUNCHER $(ls /home/*/segqueue-data/segqueue.sh 2>/dev/null | head -1)"
          echo "VENV $([ -x "$repo/.venv/bin/girder" ] && echo ok || echo missing)"
          PROBE
          sed -i "s|\$HINT_REPO|$HINT|" probe.sh
          "$RUNNER_TEMP/remote-root" < probe.sh > probe.txt 2>probe.err || true
          sed -i 's/\r$//' probe.txt probe.err 2>/dev/null || true
          while read -r line; do
            [ -n "$line" ] && echo "::notice title=Server::${line:0:300}"
          done < probe.txt

          repo=$(grep -m1 '^REPO ' probe.txt | cut -d' ' -f2- || true)
          launcher=$(grep -m1 '^LAUNCHER ' probe.txt | cut -d' ' -f2- || true)
          if [ -z "$repo" ] || [ -z "$launcher" ]; then
            echo "::error title=No deployment found::repo='$repo' launcher='$launcher'. $(head -2 probe.err | tr '\n' ' ')"
            { echo '### Probe'; echo '```'; cat probe.txt probe.err; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "SEGQUEUE_DIR=$repo" >> "$GITHUB_ENV"
          echo "SEGQUEUE_LAUNCHER=$launcher" >> "$GITHUB_ENV"
          echo "Deployment \`$repo\`, launcher \`$launcher\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy
        if: inputs.mode == 'deploy'
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
          REF: ${{ inputs.ref || github.sha }}
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/remote-root" <<REMOTE
          set -euo pipefail
          cd "$SEGQUEUE_DIR"
          previous=\$(git rev-parse HEAD)
          echo "was \$previous"
          git fetch --all --tags --prune
          git checkout --detach "$REF"
          echo "now \$(git rev-parse HEAD)"

          # Reinstall both, in the order the packages require: the root provides
          # \`segqueue\`, which girder-segqueue deliberately does not declare as a
          # dependency because the distribution that carries it is named
          # \`segtrain\` and a stranger owns that name on PyPI.
          .venv/bin/python -m pip install --quiet .
          .venv/bin/python -m pip install --quiet "./server[scoring]"

          bash "$SEGQUEUE_LAUNCHER" restart

          for i in \$(seq 1 45); do
            if curl -fsS http://127.0.0.1:8080/api/v1/system/version >/dev/null 2>&1; then
              echo "girder answered after \$((i * 2))s"
              exit 0
            fi
            sleep 2
          done
          echo "girder did not come back; rolling back to \$previous"
          tail -40 /home/*/segqueue-data/logs/girder.log 2>/dev/null || true
          git checkout --detach "\$previous"
          .venv/bin/python -m pip install --quiet . && .venv/bin/python -m pip install --quiet "./server[scoring]"
          bash "$SEGQUEUE_LAUNCHER" restart
          exit 1
          REMOTE

      - name: Server test suite
        if: inputs.mode == 'test'
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          set -euo pipefail
          # Against a scratch database on the box's own mongod. The fixture names
          # it segqueue_test_<random> and drops it; it never touches `girder`.
          "$RUNNER_TEMP/remote-root" <<REMOTE
          set -euo pipefail
          cd "$SEGQUEUE_DIR"
          .venv/bin/python -m pip install --quiet pytest pymongo
          SEGQUEUE_TEST_MONGO=mongodb://127.0.0.1:27017 \
            .venv/bin/python -m pytest -q -rs -p no:cacheprovider tests/test_segqueue_server.py 2>&1 | tail -30
          REMOTE

      - name: Smoke test
        # After a deploy as well: "it restarted" and "it works" are different
        # claims, and a plugin that failed to load serves /describe perfectly
        # well with none of its routes in it.
        if: inputs.mode != 'test'
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/remote-root" > smoke.json <<'REMOTE'
          curl -fsS http://127.0.0.1:8080/api/v1/describe
          REMOTE
          python - <<'PY'
          import json, sys
          try:
              spec = json.load(open("smoke.json"))
          except Exception as exc:
              sys.exit(f"the server did not return a usable API description: {exc}")
          have = set(spec.get("paths") or {})
          wanted = [
              "/segqueue/review/cases",
              "/segqueue/review/case/{caseId}/submissions",
              "/segqueue/review/{submissionId}/revise",
              "/segqueue/review/{submissionId}/pool",
          ]
          missing = [w for w in wanted if w not in have]
          lines = ["### Smoke test", "",
                   f"{len(have)} routes, "
                   f"{sum(1 for p in have if p.startswith('/segqueue'))} of them segqueue.", ""]
          for route in wanted:
              lines.append(f"- [{'x' if route in have else ' '}] `{route}`")
          open("summary.md", "w").write("\n".join(lines) + "\n")
          for route in missing:
              print(f"::error title=Route missing on the server::{route}")
          if missing:
              sys.exit("the deployed server does not serve: " + ", ".join(missing))
          print("all four reviewer routes are live")
          PY
          cat summary.md >> "$GITHUB_STEP_SUMMARY"
