# The one test that runs the module inside a real 3D Slicer.
#
# Deliberately NOT on pull requests. It downloads ~1.5 GB of Slicer, installs an
# extension from a third-party server, and drives a Qt application under a
# virtual framebuffer — three things that fail for reasons that have nothing to
# do with the change under review. Gating every PR on that would train everyone
# to merge past a red tick, which is worse than not running it.
#
# So it runs weekly and on demand, and when it fails it means something: either
# SegQueue broke, or a new Slicer release broke SegQueue, and both are worth
# knowing before an annotator finds out.
#
# One job here does run on pull requests: `install`, which installs the release
# zip through the Extensions Manager on Linux and macOS, the way an annotator's
# "Install from file" does. It needs nothing but a Slicer download (no extension
# server, no third-party install), and it guards the one thing that left every
# Mac annotator unable to install at all (#94): on macOS Slicer copies
# `<zip>/Slicer.app/Contents/Extensions-<revision>/<extension>`, not the zip
# root, and nothing else in CI ever looked at the archive from a Mac.
#
# `install-anywhere` also runs on pull requests: the route for any other Slicer
# (#97). The Extensions Manager route is tied to Slicer 5.8: on macOS to the
# revisions written into the zip, everywhere to `lib/Slicer-<running version>`.
# slicer/install-segqueue.py (one line pasted into Slicer's Python console)
# installs into a folder the annotator owns and registers it as an additional
# module path. The job runs it on Slicer 5.8.1, the latest stable and the
# current preview, on Apple Silicon, Intel macOS and Linux, then runs the
# SegQueue14 self-test against the installed copy.
#
# What only this job can catch (see tests/slicer_selftest.py):
#   * Segment Editor effect parameters are strings mapped to enums by name, and
#     nothing validates them. `Shape="FREE_FORM"` instead of `"FreeForm"` gave
#     0.7.0 a trim tool that activated and would not draw. No error anywhere.
#   * Segment arithmetic through the Logical operators effect does not raise on
#     a wrong operation name — it produces the wrong voxels, which is a
#     mislabelled artery nobody notices until the submission is scored.

name: Slicer self-test

on:
  schedule:
    # Mondays, 06:00 UTC. Early enough that a failure is triaged before the
    # week's labelling starts.
    - cron: "0 6 * * 1"
  pull_request:
    # Only the install job runs on pull requests (see above), and only for
    # changes to what goes into the archive or how it is checked.
    paths:
      - "slicer/SegQueue14/**"
      - "slicer/build-extension14.py"
      - "src/segqueue/**"
      - "src/segqueue14/**"
      - "tests/slicer_install_zip.py"
      - "tests/slicer_install_anywhere.py"
      - "tests/slicer_selftest14.py"
      - "slicer/install-segqueue.py"
      - "tools/fetch_slicer.py"
      - ".github/workflows/slicer-selftest.yml"
  workflow_dispatch:
    inputs:
      slicer_stability:
        description: "Which Slicer the self-tests run against"
        type: choice
        default: release
        options: [release, preview]
      install_slicer_version:
        description: "Which Slicer the install job installs the zip into"
        type: string
        default: "5.8.1"

permissions:
  contents: read

jobs:
  selftest:
    name: SegQueue inside Slicer
    # Pinned, not ubuntu-latest: package names change between images
    # (libasound2 became libasound2t64 in 24.04), and an image bump should not
    # silently break the apt step again.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: What Slicer needs to start without a screen
        # Every system library Slicer links against that a minimal 24.04 image
        # may lack (from ldd over the Slicer 5.12 tree). Listed explicitly
        # because --no-install-recommends skips xauth, which xvfb-run needs,
        # and because the runner image is not a contract.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb xauth libpulse-dev libpulse-mainloop-glib0 libnss3 \
            libglu1-mesa libgl1 libopengl0 libfontconfig1 libdbus-1-3 libcups2t64 \
            libx11-xcb1 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render0 libxcb-render-util0 libxcb-shape0 \
            libxcb-shm0 libxcb-sync1 libxcb-xfixes0 libxcb-glx0 libxcb-dri3-0 \
            libxcb-util1 libxcb-xinerama0 libxcb-xkb1 libxkbcommon0 \
            libxkbcommon-x11-0 libxcomposite1 libxcursor1 libxdamage1 libxi6 \
            libxrandr2 libxrender1 libxtst6 libsm6 libxt6 libasound2t64

      - name: Download Slicer
        env:
          STABILITY: ${{ inputs.slicer_stability || 'release' }}
        run: |
          # The current build for the chosen channel. It drifts as Slicer
          # releases, and that drift is the point: this job is also the early
          # warning that a new Slicer broke the module. Through fetch_slicer.py,
          # because download.slicer.org serves stable for `stability=preview`.
          python3 tools/fetch_slicer.py --os linux --version "$STABILITY" --out slicer.tar.gz
          mkdir -p "$HOME/slicer"
          tar -xzf slicer.tar.gz -C "$HOME/slicer" --strip-components=1
          echo "SLICER=$HOME/slicer/Slicer" >> "$GITHUB_ENV"
          "$HOME/slicer/Slicer" --version || true

      - name: Install SegmentEditorExtraEffects
        # The module is built around *Draw tube*, which this extension provides
        # and Slicer core does not. The Extensions Manager loads what it
        # installed at the *next* start, which is why this is its own Slicer
        # invocation. A script file, not --python-code: Slicer's launcher
        # rejects a --python-code value that contains a newline.
        #
        # `shell: bash` turns on pipefail, so a failed install is not hidden
        # behind the exit status of `tail`.
        shell: bash
        run: |
          xvfb-run -a "$SLICER" --no-splash --no-main-window \
            --python-script tests/slicer_install_extension.py 2>&1 | tail -20

      - name: Run the self-test
        env:
          SEGQUEUE_SELFTEST_OUT: ${{ github.workspace }}/selftest.txt
        run: |
          # Slicer's stdout is noisy and it swallows a bare sys.exit from a
          # --python-script, which is why the script writes its report to the
          # file named above and sets the process status itself.
          xvfb-run -a "$SLICER" --no-splash --no-main-window \
            --python-script tests/slicer_selftest.py --exit-after-startup
          echo "status $?"

      - name: SegQueue14 inside Slicer (seed prefill, overlap check)
        if: always()
        env:
          SEGQUEUE_SELFTEST_OUT: ${{ github.workspace }}/selftest14.txt
        run: |
          xvfb-run -a "$SLICER" --no-splash --no-main-window \
            --python-script tests/slicer_selftest14.py
          cat selftest14.txt
          { echo '### SegQueue14'; echo '```'; cat selftest14.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          tail -n 1 selftest14.txt | grep -q "RESULT PASS"

      - name: The report
        if: always()
        run: |
          if [ -f selftest.txt ]; then
            cat selftest.txt
            { echo '```'; cat selftest.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No report was written — Slicer did not reach the script." \
              >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: slicer-selftest-report
          path: selftest.txt
          if-no-files-found: ignore

  selftest-macos:
    # The same two self-tests in the macOS Slicer. Slicer's macOS package is
    # an x86_64 build, so on Apple Silicon it runs under Rosetta, which is
    # also how it runs on an annotator's M-series MacBook; the Intel runner
    # covers the older laptops.
    name: SegQueue inside Slicer (${{ matrix.runner }})
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-14, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Rosetta
        if: runner.arch == 'ARM64'
        run: sudo softwareupdate --install-rosetta --agree-to-license || true

      - name: Download Slicer
        env:
          STABILITY: ${{ inputs.slicer_stability || 'release' }}
        run: |
          python3 tools/fetch_slicer.py --os macosx --version "$STABILITY" --out slicer.dmg
          bash .github/scripts/install-slicer-macos.sh slicer.dmg "$HOME/slicer"

      - name: Install SegmentEditorExtraEffects
        shell: bash
        run: |
          "$SLICER" --no-splash --no-main-window \
            --python-script tests/slicer_install_extension.py 2>&1 | tail -20

      - name: Run the self-test
        env:
          SEGQUEUE_SELFTEST_OUT: ${{ github.workspace }}/selftest.txt
        run: |
          "$SLICER" --no-splash --no-main-window \
            --python-script tests/slicer_selftest.py --exit-after-startup
          echo "status $?"

      - name: SegQueue14 inside Slicer (seed prefill, overlap check)
        if: always()
        env:
          SEGQUEUE_SELFTEST_OUT: ${{ github.workspace }}/selftest14.txt
        run: |
          "$SLICER" --no-splash --no-main-window \
            --python-script tests/slicer_selftest14.py
          cat selftest14.txt
          { echo '### SegQueue14 on ${{ matrix.runner }}'; echo '```'; cat selftest14.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          tail -n 1 selftest14.txt | grep -q "RESULT PASS"

      - name: The report
        if: always()
        run: |
          if [ -f selftest.txt ]; then
            cat selftest.txt
            { echo '### SegQueue on ${{ matrix.runner }}'; echo '```'; cat selftest.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No report was written — Slicer did not reach the script." \
              >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: slicer-selftest-report-${{ matrix.runner }}
          path: selftest*.txt
          if-no-files-found: ignore

  install:
    # Build the zip and install it through the Extensions Manager, as an
    # annotator's "Install from file" does, then start Slicer again and check
    # the module loads from where it was installed. Against the Slicer the
    # install instructions name (5.8.1), not the newest one: the archive is
    # built for one Slicer minor version and keyed, on macOS, by revision.
    name: Install the zip (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-14, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      SLICER_VERSION: ${{ inputs.install_slicer_version || '5.8.1' }}
    steps:
      - uses: actions/checkout@v4

      - name: Rosetta
        if: runner.os == 'macOS' && runner.arch == 'ARM64'
        run: sudo softwareupdate --install-rosetta --agree-to-license || true

      - name: Slicer (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb xauth libpulse-dev libpulse-mainloop-glib0 libnss3 \
            libglu1-mesa libgl1 libopengl0 libfontconfig1 libdbus-1-3 libcups2t64 \
            libx11-xcb1 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render0 libxcb-render-util0 libxcb-shape0 \
            libxcb-shm0 libxcb-sync1 libxcb-xfixes0 libxcb-glx0 libxcb-dri3-0 \
            libxcb-util1 libxcb-xinerama0 libxcb-xkb1 libxkbcommon0 \
            libxkbcommon-x11-0 libxcomposite1 libxcursor1 libxdamage1 libxi6 \
            libxrandr2 libxrender1 libxtst6 libsm6 libxt6 libasound2t64
          python3 tools/fetch_slicer.py --os linux --version "$SLICER_VERSION" --out slicer.tar.gz --github-env
          mkdir -p "$HOME/slicer"
          tar -xzf slicer.tar.gz -C "$HOME/slicer" --strip-components=1
          echo "SLICER=xvfb-run -a $HOME/slicer/Slicer" >> "$GITHUB_ENV"

      - name: Slicer (macOS)
        if: runner.os == 'macOS'
        run: |
          python3 tools/fetch_slicer.py --os macosx --version "$SLICER_VERSION" --out slicer.dmg --github-env
          bash .github/scripts/install-slicer-macos.sh slicer.dmg "$HOME/slicer"

      - name: Build the zip
        id: zip
        shell: bash
        run: |
          # Exactly what a release publishes (built for Slicer 5.8), whatever
          # Slicer it goes into: that is what an annotator downloads (#97).
          MINOR=$(python3 -c "import importlib.util as u; s=u.spec_from_file_location('b','slicer/build-extension14.py'); m=u.module_from_spec(s); s.loader.exec_module(m); print(m.DEFAULT_SLICER_VERSION)")
          python3 slicer/build-extension14.py --out dist
          ls -l dist
          # The archive for this platform: the macOS one where there is one.
          ZIP=$(ls dist/*-Slicer-"$MINOR".zip)
          if [ "$RUNNER_OS" = macOS ] && ls dist/*-Slicer-"$MINOR"-macOS.zip >/dev/null 2>&1; then
            ZIP=$(ls dist/*-Slicer-"$MINOR"-macOS.zip)
          fi
          echo "zip=$GITHUB_WORKSPACE/$ZIP" >> "$GITHUB_OUTPUT"
          echo "packaged=$MINOR" >> "$GITHUB_OUTPUT"
          echo "Installing \`$ZIP\` into Slicer $SLICER_FETCHED_VERSION (revision $SLICER_FETCHED_REVISION, $SLICER_FETCHED_ARCH; asked for $SLICER_VERSION)" >> "$GITHUB_STEP_SUMMARY"

      - name: Install from file
        shell: bash
        env:
          SEGQUEUE_ZIP: ${{ steps.zip.outputs.zip }}
          SEGQUEUE_PACKAGED_SLICER: ${{ steps.zip.outputs.packaged }}
          SEGQUEUE_INSTALL_PHASE: install
          SEGQUEUE_SELFTEST_OUT: ${{ github.workspace }}/install.txt
        run: |
          $SLICER --no-splash --no-main-window --python-script tests/slicer_install_zip.py || true
          cat install.txt
          { echo '### Install on ${{ matrix.runner }}'; echo '```'; cat install.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          tail -n 1 install.txt | grep -q "RESULT PASS"

      - name: Restart and load it
        shell: bash
        env:
          SEGQUEUE_PACKAGED_SLICER: ${{ steps.zip.outputs.packaged }}
          SEGQUEUE_INSTALL_PHASE: load
          SEGQUEUE_SELFTEST_OUT: ${{ github.workspace }}/load.txt
        run: |
          $SLICER --no-splash --no-main-window --python-script tests/slicer_install_zip.py || true
          cat load.txt
          { echo '### Load on ${{ matrix.runner }}'; echo '```'; cat load.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          tail -n 1 load.txt | grep -q "RESULT PASS"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: slicer-install-report-${{ matrix.runner }}
          path: |
            install.txt
            load.txt
          if-no-files-found: ignore

  install-anywhere:
    # The console installer (#97), on every Slicer an annotator may have: the
    # one the instructions name, the newest stable, and today's preview (on an
    # Apple Silicon Mac the preview is the native arm64 build, as an annotator
    # downloads it; 5.8-5.12 exist only as x86_64). Then restart, load the
    # module from the folder, update over it, and run the SegQueue14 self-test
    # on the installed copy.
    name: Installer on Slicer ${{ matrix.slicer }} (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-14, macos-15-intel, ubuntu-24.04]
        slicer: ["5.8.1", release, preview]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    env:
      SLICER_VERSION: ${{ matrix.slicer }}
      # No SEGQUEUE_INSTALL_BASE: the installer's default, ~/SegQueue, as for an
      # annotator. (Not under the workspace: that is a git checkout, which the
      # update button rightly refuses to overwrite.)
    steps:
      - uses: actions/checkout@v4

      - name: Rosetta
        if: runner.os == 'macOS' && runner.arch == 'ARM64'
        run: sudo softwareupdate --install-rosetta --agree-to-license || true

      - name: Slicer (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb xauth libpulse-dev libpulse-mainloop-glib0 libnss3 \
            libglu1-mesa libgl1 libopengl0 libfontconfig1 libdbus-1-3 libcups2t64 \
            libx11-xcb1 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render0 libxcb-render-util0 libxcb-shape0 \
            libxcb-shm0 libxcb-sync1 libxcb-xfixes0 libxcb-glx0 libxcb-dri3-0 \
            libxcb-util1 libxcb-xinerama0 libxcb-xkb1 libxkbcommon0 \
            libxkbcommon-x11-0 libxcomposite1 libxcursor1 libxdamage1 libxi6 \
            libxrandr2 libxrender1 libxtst6 libsm6 libxt6 libasound2t64
          python3 tools/fetch_slicer.py --os linux --version "$SLICER_VERSION" --out slicer.tar.gz --github-env
          mkdir -p "$HOME/slicer"
          tar -xzf slicer.tar.gz -C "$HOME/slicer" --strip-components=1
          echo "SLICER=xvfb-run -a $HOME/slicer/Slicer" >> "$GITHUB_ENV"

      - name: Slicer (macOS)
        if: runner.os == 'macOS'
        run: |
          python3 tools/fetch_slicer.py --os macosx --version "$SLICER_VERSION" --out slicer.dmg --github-env
          bash .github/scripts/install-slicer-macos.sh slicer.dmg "$HOME/slicer"

      - name: Build the zip
        id: zip
        shell: bash
        run: |
          # The archive a release publishes, which is what the installer downloads.
          python3 slicer/build-extension14.py --out dist
          ZIP=$(ls dist/SegQueue-*-Slicer-5.8.zip)
          echo "zip=$GITHUB_WORKSPACE/$ZIP" >> "$GITHUB_OUTPUT"
          echo "Installer: \`$ZIP\` into Slicer $SLICER_FETCHED_VERSION (revision $SLICER_FETCHED_REVISION, $SLICER_FETCHED_ARCH; asked for $SLICER_VERSION)" >> "$GITHUB_STEP_SUMMARY"

      - name: Run the installer
        shell: bash
        env:
          SEGQUEUE_ZIP: ${{ steps.zip.outputs.zip }}
          SEGQUEUE_INSTALL_PHASE: install
          SEGQUEUE_SELFTEST_OUT: ${{ github.workspace }}/install.txt
        run: |
          $SLICER --no-splash --no-main-window --python-script tests/slicer_install_anywhere.py || true
          cat install.txt
          { echo '### Installer, Slicer ${{ matrix.slicer }} on ${{ matrix.runner }}'; echo '```'; cat install.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          tail -n 1 install.txt | grep -q "RESULT PASS"

      - name: Restart and load it
        shell: bash
        env:
          SEGQUEUE_ZIP: ${{ steps.zip.outputs.zip }}
          SEGQUEUE_INSTALL_PHASE: load
          SEGQUEUE_SELFTEST_OUT: ${{ github.workspace }}/load.txt
        run: |
          $SLICER --no-splash --no-main-window --python-script tests/slicer_install_anywhere.py || true
          cat load.txt
          { echo '### Load'; echo '```'; cat load.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          tail -n 1 load.txt | grep -q "RESULT PASS"

      - name: SegQueue14 self-test on the installed module
        shell: bash
        env:
          SEGQUEUE_SELFTEST_OUT: ${{ github.workspace }}/selftest14.txt
        run: |
          export SEGQUEUE_SELFTEST_INSTALLED="$HOME/SegQueue/lib/Slicer-5.8/qt-scripted-modules"
          $SLICER --no-splash --no-main-window --python-script tests/slicer_selftest14.py || true
          cat selftest14.txt
          { echo '### SegQueue14 self-test (installed)'; echo '```'; cat selftest14.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          tail -n 1 selftest14.txt | grep -q "RESULT PASS"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: slicer-installer-report-${{ matrix.runner }}-${{ matrix.slicer }}
          path: |
            install.txt
            load.txt
            selftest14.txt
          if-no-files-found: ignore

  install-safari:
    # Safari unzips downloads by default ("Open 'safe' files after
    # downloading"), so a Mac annotator who downloads the release by hand gets
    # a folder, not a zip (#97). Simulated with `ditto -x -k` (what Archive
    # Utility does) into ~/Downloads, with the quarantine attribute Safari adds.
    #   safari-folder: that folder registered as an additional module path (the
    #     manual route), restart, load, update over it, SegQueue14 self-test.
    #   finder-recompress: the extracted macOS zip compressed again in Finder
    #     (`ditto -c -k --sequesterRsrc --keepParent`, what Compress does) and
    #     given to Install from file on Slicer 5.8.1.
    name: Safari download, ${{ matrix.mode }} (Slicer ${{ matrix.slicer }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {mode: safari-folder, slicer: "5.8.1"}
          - {mode: safari-folder, slicer: preview}
          - {mode: finder-recompress, slicer: "5.8.1"}
    runs-on: macos-14
    timeout-minutes: 40
    env:
      SLICER_VERSION: ${{ matrix.slicer }}
    steps:
      - uses: actions/checkout@v4

      - name: Rosetta
        run: sudo softwareupdate --install-rosetta --agree-to-license || true

      - name: Slicer
        run: |
          python3 tools/fetch_slicer.py --os macosx --version "$SLICER_VERSION" --out slicer.dmg --github-env
          bash .github/scripts/install-slicer-macos.sh slicer.dmg "$HOME/slicer"

      - name: Download in Safari (simulated)
        id: safari
        shell: bash
        run: |
          python3 slicer/build-extension14.py --out dist
          if [ "${{ matrix.mode }}" = finder-recompress ]; then
            ZIP=$(ls dist/SegQueue-*-Slicer-5.8-macOS.zip)
          else
            ZIP=$(ls dist/SegQueue-*-Slicer-5.8.zip)
          fi
          mkdir -p "$HOME/Downloads"
          ditto -x -k "$ZIP" "$HOME/Downloads"
          xattr -w -r com.apple.quarantine "0083;$(printf %x "$(date +%s)");Safari;" "$HOME/Downloads/SegQueue"
          echo "Safari left this in ~/Downloads (from \`$(basename "$ZIP")\`):" >> "$GITHUB_STEP_SUMMARY"
          { echo '```'; ls -la "$HOME/Downloads"; find "$HOME/Downloads/SegQueue" -maxdepth 6 -type d | head -20; xattr -l "$HOME/Downloads/SegQueue/share" 2>/dev/null | head -2; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          echo "zip=$GITHUB_WORKSPACE/$ZIP" >> "$GITHUB_OUTPUT"

      - name: Compress it again in Finder (simulated)
        if: matrix.mode == 'finder-recompress'
        shell: bash
        run: |
          (cd "$HOME/Downloads" && ditto -c -k --sequesterRsrc --keepParent SegQueue "$GITHUB_WORKSPACE/SegQueue.zip")
          { echo '```'; unzip -l SegQueue.zip | head -8; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Register the folder / Install from file
        shell: bash
        env:
          SEGQUEUE_INSTALL_PHASE: install
          SEGQUEUE_SELFTEST_OUT: ${{ github.workspace }}/install.txt
          SEGQUEUE_PACKAGED_SLICER: "5.8"
        run: |
          if [ "${{ matrix.mode }}" = finder-recompress ]; then
            export SEGQUEUE_ZIP="$GITHUB_WORKSPACE/SegQueue.zip"
            $SLICER --no-splash --no-main-window --python-script tests/slicer_install_zip.py || true
          else
            export SEGQUEUE_ZIP="${{ steps.safari.outputs.zip }}"
            export SEGQUEUE_INSTALL_BASE="$HOME/Downloads/SegQueue"
            export SEGQUEUE_REGISTER_FOLDER="$HOME/Downloads/SegQueue/lib/Slicer-5.8/qt-scripted-modules"
            $SLICER --no-splash --no-main-window --python-script tests/slicer_install_anywhere.py || true
          fi
          cat install.txt
          { echo '### Install (${{ matrix.mode }}, Slicer ${{ matrix.slicer }})'; echo '```'; cat install.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          tail -n 1 install.txt | grep -q "RESULT PASS"

      - name: Restart and load it
        shell: bash
        env:
          SEGQUEUE_INSTALL_PHASE: load
          SEGQUEUE_SELFTEST_OUT: ${{ github.workspace }}/load.txt
          SEGQUEUE_PACKAGED_SLICER: "5.8"
        run: |
          if [ "${{ matrix.mode }}" = finder-recompress ]; then
            $SLICER --no-splash --no-main-window --python-script tests/slicer_install_zip.py || true
          else
            export SEGQUEUE_ZIP="${{ steps.safari.outputs.zip }}"
            export SEGQUEUE_INSTALL_BASE="$HOME/Downloads/SegQueue"
            $SLICER --no-splash --no-main-window --python-script tests/slicer_install_anywhere.py || true
          fi
          cat load.txt
          { echo '### Load'; echo '```'; cat load.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          tail -n 1 load.txt | grep -q "RESULT PASS"

      - name: SegQueue14 self-test on the installed module
        if: matrix.mode == 'safari-folder'
        shell: bash
        env:
          SEGQUEUE_SELFTEST_OUT: ${{ github.workspace }}/selftest14.txt
        run: |
          export SEGQUEUE_SELFTEST_INSTALLED="$HOME/Downloads/SegQueue/lib/Slicer-5.8/qt-scripted-modules"
          $SLICER --no-splash --no-main-window --python-script tests/slicer_selftest14.py || true
          cat selftest14.txt
          { echo '### SegQueue14 self-test (installed)'; echo '```'; cat selftest14.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          tail -n 1 selftest14.txt | grep -q "RESULT PASS"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: slicer-safari-report-${{ matrix.mode }}-${{ matrix.slicer }}
          path: |
            install.txt
            load.txt
            selftest14.txt
          if-no-files-found: ignore
