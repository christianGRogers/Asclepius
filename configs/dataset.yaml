# Tracked template. Copy to configs/dataset.local.yaml (gitignored) and edit
# paths for your machine; segtrain prefers the .local.yaml when it exists.
#
# Every path here can also be overridden by an environment variable or a CLI
# flag, so the same repo drives a laptop, a rented GPU box, and a cluster
# without any file edits. Precedence: CLI flag > env var > .local.yaml > this.

# Root of the source dataset, read in place and never written to. One directory
# per case, plus a meta.csv index.
#
# For phase 1 (task 710, coronary) this is your own labelled CCTA:
#
#   <root>/<case>/ct.nii.gz
#   <root>/<case>/segmentations/left_main.nii.gz     one binary mask per vessel
#   <root>/<case>/segmentations/left_circumflex.nii.gz
#     ... or ...
#   <root>/<case>/labels.nii.gz                      one integer volume
#
# Either form works and the choice is detected per case. For the single-file
# form, tell configs/labels/coronary.yaml which integer means which vessel via
# `source_values` -- an exported segmentation numbers its segments in the order
# they were drawn, and reading those positionally mislabels every vessel while
# appearing to succeed.
#
# There is no meta.csv until you write one:  segtrain index --root <root>
#
# For phase 2 (tasks 702-706) this is the TotalSegmentator Zenodo tree instead,
# which ships its own meta.csv. The key is still called zenodo_root for that
# reason.
zenodo_root: /data/coronary

# nnU-Net's three roots. These are the ones that get large -- see README for
# sizing. Put them on the training machine's fastest large disk.
nnunet_raw: /data/nnUNet_raw                   # env: nnUNet_raw
nnunet_preprocessed: /data/nnUNet_preprocessed # env: nnUNet_preprocessed
nnunet_results: /data/nnUNet_results           # env: nnUNet_results

# Where run directories live (events.jsonl, previews/, logs). Small. This is the
# directory the Slicer monitor connects to.
runs_root: /data/runs

# On Trillium every one of the five paths above must be under $SCRATCH. $HOME and
# $PROJECT are mounted READ-ONLY on compute nodes, so a job whose results_root is
# in either dies on its first write -- after its queue wait. So:
#
#   zenodo_root:         /scratch/g/group/you/coronary
#   nnunet_raw:          /scratch/g/group/you/nnUNet_raw
#   nnunet_preprocessed: /scratch/g/group/you/nnUNet_preprocessed
#   nnunet_results:      /scratch/g/group/you/nnUNet_results
#   runs_root:           /scratch/g/group/you/runs
#
# The venv is the exception and belongs in $HOME -- see the scinet: block below.
# `segtrain scinet check` flags any of these that sit on a read-only filesystem.

# How to materialise images into nnUNet_raw/imagesTr:
#   hardlink - 0 extra bytes, requires same filesystem as zenodo_root (default)
#   symlink  - 0 extra bytes, works across filesystems, needs privilege on Windows
#   copy     - always works, costs a full duplicate of every image
link_mode: hardlink

# Number of worker processes for the mask-merging conversion. Conversion is
# I/O-bound on decompressing one small mask per structure per case, so
# oversubscribing cores helps. 0 means "os.cpu_count()".
convert_workers: 0

# Which nnU-Net image reader to record in dataset.json. Do not change this
# without reading the note in convert.py.
#
# nnU-Net's default is SimpleITK, and ITK rejects NIfTI files whose direction
# cosines are not orthonormal to its tolerance. Obliquely-acquired volumes stored
# as float32 routinely fall just outside it, and cardiac CT is often reconstructed
# on an oblique grid. Those cases then fail to preprocess and vanish from the
# training set quietly -- in TotalSegmentator it is 136 of 1228 volumes, 11.1%,
# and unevenly distributed across study types. nibabel reads them all, and
# WithReorient additionally normalises orientation before training and restores it
# when writing predictions.
reader_writer: NibabelIOWithReorient

# How to resolve a voxel claimed by two structures when merging binary masks.
# Only applies to the per-structure form; a single integer label volume already
# has one owner per voxel.
#
# Masks drawn independently overlap at shared interfaces. For the coronary tree
# that means the LM/LAD and LM/LCx bifurcations, and the RCA/PDA continuation --
# a voxel or two each, but a multilabel volume needs one owner per voxel. In
# TotalSegmentator it is colon against small bowel, heart against inferior vena
# cava, L5 against sacrum, and about 0.02% of voxels overall.
#
#   smaller_wins  contested voxels go to the smaller structure in that case, so
#                 thin structures are not eroded by bulky neighbours (default)
#   label_order   higher label index wins; alphabetical, so anatomically
#                 arbitrary. Provided only for comparison.
overlap_policy: smaller_wins

# Running on a SciNet cluster via SLURM. Defaults target Trillium's GPU
# subcluster (4x H100-80GB per node, x86_64, 24 h walltime cap).
#
# On the cluster, copy this file and set `account` and `venv`; everything else
# has a working default. `segtrain scinet check` verifies the result before you
# spend a queue wait finding out.
scinet:
  cluster: trillium

  # The only field with no default. SLURM rejects a job with no --account once
  # you belong to more than one allocation. `sshare -U` lists yours; RAC names
  # start with rrg-/rpp-, the default allocation with def-. Also read from
  # $SLURM_ACCOUNT, so it need not be written here at all.
  account: ""

  # Leave both empty on Trillium. Its docs are explicit: "Do not specify this
  # partition explicitly; you must allow the scheduler to select the appropriate
  # partition for your job."
  gpu_partition: ""
  cpu_partition: ""

  nodes: 1
  # Trillium schedules whole GPUs. 1 gets you a quarter node -- 1 H100, 24 of the
  # 96 cores, ~188 GiB. 2 and 3 are rejected; above 1 you must ask in multiples
  # of 4.
  #
  # One H100 is the right ask, but do not let its 80 GB go unused: nnU-Net plans
  # against an 8 GB VRAM budget by default, and patch size is the single biggest
  # lever on coronary accuracy. Pass `--gpu-mem` to `segtrain plan` to spend the
  # rest of the card on larger patches.
  gpus_per_node: 1
  # 0 = do not emit --cpus-per-task. The cores come with the GPU, and the job
  # reads $SLURM_CPUS_ON_NODE rather than asserting a number the scheduler may
  # ignore.
  cpus_per_task: 0
  # Ignored on Trillium ("Memory requests are ignored... Do not use --mem").
  mem: ""

  # The cap is 24 h. Ten minutes under leaves room to be placed and to shut down
  # before SLURM's own kill.
  walltime: "23:50:00"
  # Subtracted from walltime to get the trainer's wall-clock budget, after which
  # it checkpoints and stops at the next epoch boundary. Must cover module load,
  # the venv, nnU-Net unpacking, one whole epoch, and a ~400 MB checkpoint write.
  pause_margin_seconds: 1800

  # How the run crosses the 24 h cap. Both submit the whole chain from the login
  # node, because Trillium forbids a job from submitting anything.
  #   array       one `sbatch --array=1-N%1`; N blocks, one at a time (default)
  #   dependency  N separate jobs, each --dependency=afterany on the last.
  #               Use this if job arrays turn out to be restricted.
  chain_mode: array
  # Blocks in the chain, and the hard ceiling on resubmission. 3 x 23:50 is
  # ~71 h. Raise it if a larger patch size pushes the epoch time up.
  chain_max: 3

  # nnU-Net checkpoints every 50 epochs by default. Lower means an *unclean* kill
  # -- preemption, node failure, OOM -- costs less. A clean pause is unaffected.
  save_every: 25
  # 0 = read $SLURM_CPUS_ON_NODE at run time. Set a number only to throttle.
  dataloader_workers: 0

  # Copy preprocessed data into $SLURM_TMPDIR and train from there.
  #
  # Off by default, and think before enabling: Trillium nodes have NO local disk,
  # so $SLURM_TMPDIR is a RAM disk and its contents come out of the job's own
  # memory (~188 GiB for a 1-GPU job). Measure your preprocessed size first: CCTA
  # at ~0.35 mm is not small, nnU-Net's .npz -> .npy step roughly doubles it, and
  # the 1.5 mm phase 2 tasks are ~75 GB before unpacking and do not fit.
  # Less necessary here than the usual HPC advice implies -- Trillium's storage
  # is all-NVMe rather than Lustre. The job script re-checks the fit and skips
  # staging rather than being OOM-killed.
  stage_to_tmpdir: false

  # The CPU-only convert/plan/preprocess job. The CPU subcluster is 1224 nodes
  # against the GPU subcluster's 63, so this usually starts much sooner.
  prepare_walltime: "12:00:00"
  prepare_cpus: 0

  # Loaded by every job. Keep cuda OUT of this list -- Trillium's CPU nodes have
  # no cuda module and the prepare job would fail at `module load`.
  modules: [StdEnv/2023, python/3.11.5]
  # Loaded by GPU jobs only, on top of `modules`.
  gpu_modules: [cuda/12.6]

  # Build this on a login node with `segtrain scinet setup`, and keep it in
  # $HOME: compute nodes can read $HOME, $SCRATCH "may get partially deleted",
  # and $SLURM_TMPDIR is RAM.
  venv: ""                        # e.g. /home/g/group/you/segtrain-env
  # Extra shell lines after the venv is active, before the pipeline runs.
  setup_commands: []
  # Raw #SBATCH lines appended verbatim, for anything not modelled above.
  sbatch_extra: []                # e.g. ["#SBATCH --export=NONE"]

  mail_user: ""
  mail_type: "FAIL,TIME_LIMIT"

  # Only used to print a paste-ready address for the Slicer monitor, and by
  # `segtrain scinet pull`.
  login_host: ""                  # e.g. you@trillium.alliancecan.ca

preview:
  # Cases the preview daemon runs the live checkpoint on, rendered into the
  # Slicer monitor so you can watch a vessel sharpen over training.
  #
  # These MUST be in the validation split -- a preview rendered on a training
  # case looks excellent and means nothing. `segtrain preview` checks this
  # against splits_final.json and refuses rather than quietly flattering the run.
  #
  # Left empty because the right choice depends on your cases. Pick two or three
  # from the val split once `segtrain index` has assigned them, spanning what you
  # care about: one clean/normal, one calcified or stenotic (where the model will
  # struggle first), and one with an anatomical variant if you have the extended
  # label set.
  cases: []
  # Run a preview at most this often, in epochs. Inference on a whole volume
  # costs real GPU time, so keep this well above 1.
  every_n_epochs: 25
  # Skip a preview if the previous one has not finished. Training always wins.
  skip_if_busy: true
