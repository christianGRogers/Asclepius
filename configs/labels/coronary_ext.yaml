# Phase 1, extended: major branches plus the two common anatomical variants.
#
# HAND-WRITTEN -- see the note at the top of coronary.yaml.
#
# A strict superset of `coronary`: indices 1-4 are byte-identical, so the two
# sets share an output-channel prefix and a `coronary` model's predictions can be
# read against this vocabulary without remapping.
#
# Use this only if your labelling actually distinguishes these two. Both are
# anatomically optional, which makes them awkward classes:
#
#   ramus_intermedius   present in roughly a quarter to a third of people. In the
#                       rest it simply does not exist, so most cases contribute
#                       no foreground voxels for it at all.
#   posterior_descending_artery
#                       always present, but arises from the RCA in a
#                       right-dominant heart (~85%), from the LCx in a
#                       left-dominant one (~7%), and from both when codominant.
#
# The consequence for training: per-class Dice for these two will be computed
# over a minority of cases and will look far noisier than the four main branches.
# That is the anatomy, not the model. If a class is absent from a case, leave the
# mask out rather than writing an empty one -- `segtrain convert` reports absent
# structures and skips them, which is the behaviour you want here.

name: coronary_ext
count: 6
labels:
  left_main:                   1
  left_anterior_descending:    2
  left_circumflex:             3
  right_coronary_artery:       4

  # Trifurcation branch off the left main, between the LAD and LCx.
  ramus_intermedius:           5

  # PDA / posterior interventricular artery. Labelled separately here because
  # which vessel it comes off is exactly what coronary dominance means, and that
  # is clinically reportable.
  posterior_descending_artery: 6
