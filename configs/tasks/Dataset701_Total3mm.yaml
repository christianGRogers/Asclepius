# Stage 1: every structure in a single low-resolution model.
#
# The point of this task is speed to first signal. One model over all 117 classes
# at 3 mm trains in ~1-2 days on a single modern GPU and is immediately useful
# for visualising quality in Slicer, at the cost of boundary precision on small
# structures (adrenals, ribs, small vessels). The 1.5 mm group models in tasks
# 702-706 are what fix that.

dataset_id: 701
dataset_name: Total3mm
label_set: all117

# The source data is 1.5 mm isotropic, so nnU-Net would self-configure to 1.5 mm
# and this task would silently become a full-resolution 117-class model that does
# not fit in VRAM. Forcing the target spacing is the whole trick here; patch size
# and batch size are still left to nnU-Net to recompute.
spacing: [3.0, 3.0, 3.0]

configuration: 3d_fullres
trainer: nnUNetTrainer_segtrain
plans_name: segtrainPlans_3mm

epochs: 1000
folds: [0]
