# PHASE 2 region model: vertebrae C1-C7, T1-T12, L1-L5, S1 (25 classes).
#
# The hard part is labelling, not segmentation: neighbouring vertebrae look
# nearly identical, so errors are overwhelmingly off-by-one shifts along the
# spine rather than bad boundaries. Watch for that pattern in the per-class Dice
# table -- a whole run of adjacent vertebrae at low Dice means a counting error,
# not a segmentation failure, and it usually traces to cases with a limited
# field of view where the reference vertebra is not in frame.

dataset_id: 703
dataset_name: Vertebrae
label_set: vertebrae

spacing: [1.5, 1.5, 1.5]

configuration: 3d_fullres
trainer: nnUNetTrainer_segtrain
plans_name: segtrainPlans_15mm

epochs: 1000
folds: [0]
