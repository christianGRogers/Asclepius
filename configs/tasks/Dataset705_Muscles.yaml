# Stage 2 group: skeletal muscles (10 classes).
#
# Smallest group, all bilateral pairs: gluteus maximus/medius/minimus,
# autochthon (paraspinal), iliopsoas. Boundaries between adjacent muscles are
# genuinely low-contrast on CT, so surface metrics (NSD) matter more than Dice
# here -- a model can score well on overlap while placing the maximus/medius
# interface a few millimetres off.

dataset_id: 705
dataset_name: Muscles
label_set: muscles

spacing: [1.5, 1.5, 1.5]

configuration: 3d_fullres
trainer: nnUNetTrainer_segtrain
plans_name: segtrainPlans_15mm

epochs: 1000
folds: [0]
