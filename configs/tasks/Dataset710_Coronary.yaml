# Coronary task. The training plan that populated this file has been retired --
# see docs/PLAN-STATUS.md; the previous version is on branch `plan-v1`.
#
# The values below are placeholders chosen to keep the pipeline loadable, NOT
# plan decisions. Every one of them is open: class schema, target spacing and
# whether a floor is enforced, configuration, patch size against the H100's
# 80 GB, schedule, and fold scheme.

dataset_id: 710
dataset_name: Coronary

label_set: placeholder

# `native` = let nnU-Net's median-spacing rule choose. This is the absence of a
# decision, not a decision. No resolution floor is declared.
spacing: native

configuration: 3d_fullres
trainer: nnUNetTrainer_segtrain
plans_name: segtrainPlans_coronary

epochs: 1000
folds: [0]
