[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "segtrain"
version = "0.1.0"
description = "Training pipeline for whole-body CT anatomical segmentation (nnU-Net v2), with live monitoring from 3D Slicer"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Christian Rogers" }]
keywords = ["segmentation", "nnunet", "ct", "totalsegmentator", "3d-slicer"]

# Deliberately light. `segtrain convert/splits/evaluate` and the Slicer monitor
# run on these alone -- no torch, no nnU-Net. That is what lets the data prep and
# the monitor UI run on a laptop with no GPU. Training pulls in `[train]`.
dependencies = [
    "numpy>=1.21",
    "nibabel>=4.0",
    "PyYAML>=6.0",
    "scipy>=1.7",
]

[project.optional-dependencies]
# Installed on the training machine only. torch is intentionally unpinned here:
# pick the build that matches the box's CUDA version, then install this extra.
train = [
    "nnunetv2>=2.5,<3",
    "SimpleITK>=2.2",
]
dev = [
    "pytest>=7",
    "pytest-cov",
    # Not `>=0.4`: the lint config below ignores UP045, which ruff only grew in
    # 0.9. An older ruff does not warn about the unknown selector -- it refuses
    # to parse pyproject.toml at all, and `ruff check` fails with a config
    # error that reads nothing like a lint failure. CI pins an exact version;
    # see .github/workflows/ci.yml.
    "ruff>=0.9",
]

[project.scripts]
segtrain = "segtrain.cli:main"

[project.urls]
Homepage = "https://github.com/chrisrogers/segmentator-train"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
segtrain = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "needs_data: requires the TotalSegmentator dataset on disk",
    "needs_network: queries a public API; skips when it is unreachable",
    "slow: takes more than a few seconds",
    "needs_mongo: requires a MongoDB; set SEGQUEUE_TEST_MONGO to its URI",
]

[tool.ruff]
line-length = 100
# Slicer 5.8 bundles Python 3.9, and the monitor module runs inside it.
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    # `Optional[X]` is explicit and reads fine; rewriting to `X | None` across
    # the codebase would be churn for no benefit.
    "UP045",
    # Same argument, same codebase: `Dict[str, int]` says what it means, and
    # `src/segqueue` is read by people maintaining a Python 3.9 Slicer module
    # where the explicit spelling is the familiar one. UP006/UP035 would
    # rewrite every annotation in `release.py` to prove a point about builtins.
    "UP006",
    "UP035",
]

[tool.ruff.lint.per-file-ignores]
# The Slicer module is loaded by Slicer's own importer, not as part of the
# segtrain package. It has no `from __future__ import annotations`, and its
# imports genuinely cannot all sit at the top: `src/` must be put on sys.path
# before `segtrain.events` can be imported at all.
"slicer/**" = ["E402", "I001", "UP031", "UP032"]
# `.format()` over f-strings in the tests too: the two suites that matter most
# here read the Slicer module and mirror its idiom, and a test that looks like
# the code it checks is easier to trust.
"tests/**" = ["UP031", "UP032"]
# slicer_selftest.py is Slicer code that happens to live in tests/ -- it runs
# inside Slicer's own interpreter, never under pytest, and is written in the
# same idiom as the module it exercises.
"tests/slicer_selftest.py" = ["UP004", "UP020", "UP031", "UP032"]
